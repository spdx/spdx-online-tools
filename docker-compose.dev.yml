services:
  spdx:
    container_name: spdx_dev
    image: spdx-dev:latest
    build:
      context: ./
      dockerfile: dockerfile.dev
    ports:
      - 8000:8000
    volumes:
      - ./src:/spdx/src # Allow live code reloading
      - static_volume:/spdx/static
      - media_volume:/spdx/media
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/spdx/src
      - SPDX_VALKEY_HOST=valkey
      - SPDX_REDIS_HOST=valkey
      - SPDXParser.LocalLicensesDir=/_license-list-data/current
      - SPDXParser.OnlyUseLocalLicenses=true
    env_file: .env
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: always
    volumes:
      - data-volume:/data
    ports:
      - 6379:6379

volumes:
  data-volume:
  static_volume:
  media_volume:
