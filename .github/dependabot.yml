version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  cooldown:
      default-days: 7
  open-pull-requests-limit: 99
  schedule:
    interval: "weekly"
  groups:
    dependencies:
      applies-to: version-updates
      patterns:
        - "*"
      update-types:
        - "minor"
        - "patch"
- package-ecosystem: docker
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: "weekly"
- package-ecosystem: docker-compose
  directory: "/"
  schedule:
    interval: "monthly"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
