---
name: App tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-app.yml"
      - "src/app/**"
      - "src/tests/app/**"
      - "src/tests/test_helpers.py"
      - "src/tests/fixtures/**"
      - "src/examples/**"
      - "src/config/**"
      - "src/manage.py"
      - "src/tool.jar"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test-app.yml"
      - "src/app/**"
      - "src/tests/app/**"
      - "src/tests/test_helpers.py"
      - "src/tests/fixtures/**"
      - "src/examples/**"
      - "src/config/**"
      - "src/manage.py"
      - "src/tool.jar"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"

concurrency:
  group: test-app-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run App tests
        env:
          ONLINE_TOOL_GITHUB_KEY: ${{ secrets.ONLINE_TOOL_GITHUB_KEY }}
          ONLINE_TOOL_GITHUB_SECRET: ${{ secrets.ONLINE_TOOL_GITHUB_SECRET }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          TEST_GITHUB_USER_ID: ${{ secrets.TEST_GITHUB_USER_ID }}
          TEST_GITHUB_USER_NAME: ${{ secrets.TEST_GITHUB_USER_NAME }}
          OAUTH_APP_ID: ${{ secrets.OAUTH_APP_ID }}
          OAUTH_APP_SECRET: ${{ secrets.OAUTH_APP_SECRET }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
        run: |
          cd src
          python manage.py makemigrations
          python manage.py migrate
          python manage.py test tests.app -v 2
