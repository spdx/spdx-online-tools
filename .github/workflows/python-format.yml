name: Python format

on:
  push:
    branches:
      - main
    paths:
      - 'src/*.py'
      - 'src/tests/*.py'
      - 'src/tests/api/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/python-format.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/*.py'
      - 'src/tests/*.py'
      - 'src/tests/api/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/python-format.yml'

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Black Python code formatter
        uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc  # v26.10.1
        with:
          src: "src/manage.py src/populate.py src/tests"
